<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Asna ❤️</title>

  <!-- Eye-catching title font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #1c1b2f, #2a2745);
      font-family: "Comic Sans MS", cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #f2e9f7;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 0 25px rgba(255, 182, 222, 0.25);
      animation: popIn 1s ease;
      z-index: 2;
      max-width: 90%;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 1px;
      color: #ffb7dd;
      margin-bottom: 12px;
      animation: floatText 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
    }

    .caption {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 15px;
      color: #e6d7ee;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    p {
      font-size: 16px;
      margin: 10px 0;
      line-height: 1.4;
      color: #f6edf9;
    }

    .sparkle {
      animation: sparkle 1.5s infinite alternate;
    }

    .fade-line {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes floatText {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    @keyframes sparkle {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }

    @keyframes glow {
      from { text-shadow: 0 0 6px rgba(255,183,221,0.4); }
      to { text-shadow: 0 0 14px rgba(255,183,221,0.9); }
    }

    /* Floating elements */
    .heart, .baby, .butterfly {
      position: absolute;
      bottom: -30px;
      font-size: 16px;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px rgba(255,180,220,0.6));
      z-index: 1;
    }

    .heart { animation: floatUp linear forwards; }
    .baby { animation: babyFloat linear forwards; }
    .butterfly { animation: butterflyFloat linear forwards; }

    @keyframes floatUp {
      to { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }

    @keyframes babyFloat {
      to { transform: translateY(-120vh) scale(1.2); opacity: 0; }
    }

    @keyframes butterflyFloat {
      to { transform: translateY(-120vh) translateX(40px) scale(1.1); opacity: 0; }
    }

    /* Stars */
    .star {
      position: absolute;
      top: -10px;
      font-size: 10px;
      opacity: 0.6;
      animation: starTwinkle linear forwards;
      z-index: 0;
    }

    @keyframes starTwinkle {
      50% { opacity: 0.8; }
      to { transform: translateY(120vh) scale(1); opacity: 0; }
    }

    /* Tap heart */
    .tap-heart {
      position: absolute;
      font-size: 18px;
      animation: tapPop 1.2s ease forwards;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes tapPop {
      to { transform: scale(2); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 class="fade-line" style="animation-delay:0s;">❤️ HAPPY BIRTHDAY ASNA ❤️</h1>

    <p class="fade-line caption" style="animation-delay:0.6s;">
      Hey asna ❤️
    </p>

    <p class="fade-line" style="animation-delay:1.2s;">
      Happy birthday to you 🎈
    </p>

    <p class="fade-line" style="animation-delay:1.8s;">
      May God bless you 💖
    </p>

    <p class="fade-line" style="animation-delay:2.4s;">
      And give you many happiness as always 💕
    </p>

    <p class="fade-line" style="animation-delay:3s;">
      You are so pretty 🫠 <br> and the cutest 🤗
    </p>

    <p class="fade-line" style="animation-delay:3.6s;">
      I hope you will have a great year <br>
      and congrats for being a sister again 🙈
    </p>

    <p class="fade-line sparkle" style="animation-delay:4.4s;">
      ❤️ HAPPY BIRTHDAY ASNA ❤️
    </p>
  </div>

  <script>
    const hearts = ["💖","💗","💕","💞","🩷"];
    const babies = ["👶","🧸","🐻","☁️","🌸"];
    const butterflies = ["🦋","🌸","🌷"];
    const stars = ["✨","⭐","🌟"];

    function float(el, cls, arr, dur, life) {
      const e = document.createElement("div");
      e.className = cls;
      e.innerText = arr[Math.floor(Math.random()*arr.length)];
      e.style.left = Math.random()*100 + "vw";
      e.style.animationDuration = dur;
      document.body.appendChild(e);
      setTimeout(()=>e.remove(), life);
    }

    setInterval(()=>float("","heart",hearts,(4+Math.random()*3)+"s",7000),400);
    setInterval(()=>float("","baby",babies,(6+Math.random()*4)+"s",8000),1200);
    setInterval(()=>float("","butterfly",butterflies,(7+Math.random()*5)+"s",12000),2000);
    setInterval(()=>float("","star",stars,(8+Math.random()*6)+"s",14000),1200);

    document.addEventListener("click",(e)=>{
      const h=document.createElement("div");
      h.className="tap-heart";
      h.innerText="💗";
      h.style.left=e.clientX+"px";
      h.style.top=e.clientY+"px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1200);
    });
  </script>

</body>
</html>
