<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Asna 🎂</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffd6ea, #fff0f7);
      font-family: "Comic Sans MS", cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
      animation: popIn 1s ease;
      z-index: 2;
      max-width: 90%;
    }

    h1 {
      color: #ff5fa2;
      margin-bottom: 10px;
      animation: floatText 3s ease-in-out infinite;
    }

    p {
      font-size: 17px;
      margin: 8px 0;
    }

    .sparkle {
      animation: sparkle 1.5s infinite alternate;
    }

    @keyframes popIn {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes floatText {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    @keyframes sparkle {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }

    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      animation: floatUp linear forwards;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🎂 happy birthday asna 🎂</h1>
    <p class="sparkle">the cutest person 🧸💖</p>
    <p>you make everything brighter ☀️✨</p>
    <p>never stop being this amazing 🌸</p>
  </div>

  <script>
    const hearts = ["💖", "💗", "💕", "💞", "🩷"];

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(createHeart, 350);
  </script>
</body>
</html>
